name: "Storybook Nx Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/storybook-benchmark.yml"
      - ".github/workflows/storybook-fresh-benchmark.yml"
      - ".github/workflows/reusable-nx-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      node_version: "22.22.3"
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      node_version: "22.22.3"
    secrets: inherit
