name: "Storybook Nx Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling' && 'Rolling' || 'Fresh', github.event_name == 'schedule' && 'Scheduled' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
  schedule:
    - cron: "0 4 * * 3"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/storybook-benchmark.yml"
      - ".github/workflows/reusable-nx-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      project_repo: storybookjs/storybook
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      node_version: "22.22.3"
      install_command: yarn install --immutable
      build_command: "yarn nx run bench/react-vite-default-ts:build --parallel=1"
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      project_repo: storybookjs/storybook
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      node_version: "22.22.3"
      install_command: yarn install --immutable
      build_command: "yarn nx run bench/react-vite-default-ts:build --parallel=1"
    secrets: inherit
