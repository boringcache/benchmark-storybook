name: "Storybook Nx Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * 3"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      strategy: actions-cache
      cache_lane: fresh
      node_version: "22.22.3"
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-nx-benchmark.yml
    with:
      benchmark_id: storybook
      strategy: boringcache
      cache_lane: fresh
      cli_version: ${{ inputs.cli_version }}
      node_version: "22.22.3"
    secrets: inherit
