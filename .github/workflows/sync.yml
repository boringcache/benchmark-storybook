name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: "26,56 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmark-storybook-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync With Upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}

      - name: Sync upstream submodule
        id: sync
        run: |
          set -euo pipefail
          echo "updated=false" >> "$GITHUB_OUTPUT"
          git config --global user.name "boringcache-bot"
          git config --global user.email "boringcache-bot@users.noreply.github.com"

          git submodule sync --recursive
          git submodule update --init --remote --checkout upstream

          node_version="$(tr -d '[:space:]' < upstream/.nvmrc)"
          if [[ ! "${node_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Node version in upstream/.nvmrc: ${node_version:-<empty>}" >&2
            exit 1
          fi
          node_workflows=(
            .github/workflows/storybook-benchmark.yml
            .github/workflows/storybook-fresh-benchmark.yml
          )
          for workflow in "${node_workflows[@]}"; do
            if ! grep -qE '^[[:space:]]+node_version:' "${workflow}"; then
              echo "No Node version input found in ${workflow}." >&2
              exit 1
            fi
            sed -i -E \
              "s/node_version: .*/node_version: \"${node_version}\"/" \
              "${workflow}"
            if grep -E '^[[:space:]]+node_version:' "${workflow}" | grep -Fv "node_version: \"${node_version}\""; then
              echo "Not every Node version input in ${workflow} uses upstream Node ${node_version}." >&2
              exit 1
            fi
          done

          github_repo_slug() {
            local url="$1"
            url="${url%/}"
            url="${url#https://github.com/}"
            url="${url#git@github.com:}"
            url="${url#ssh://git@github.com/}"
            url="${url%.git}"
            url="${url%/}"
            printf '%s' "$url"
          }

          upstream_url="$(cd upstream && git remote get-url origin)"
          upstream_repo="$(github_repo_slug "$upstream_url")"
          commit_sha="$(cd upstream && git rev-parse --short=7 HEAD)"

          if git diff --quiet --submodule=short; then
            echo "No upstream changes"
            exit 0
          fi

          git add upstream "${node_workflows[@]}"
          git commit -m "Update upstream to ${upstream_repo}@${commit_sha}"
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch rolling benchmark
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run storybook-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main
