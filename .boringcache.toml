workspace = "boringcache/benchmarks"

# Nx self-hosted remote-cache benchmark. boringcache/one mode=nx-proxy
# owns the task-output cache, so the benchmark profile archives only Yarn
# dependency state that the remote adapter does not cover.

[adapters.nx]
no-platform = true
no-git = true

[entries.yarn-cache]
tag = "yarn-cache"
default_path = "~/.yarn/berry/cache"

[entries.yarn-install-state]
tag = "yarn-install-state"
default_path = "upstream/.yarn/root-install-state.gz"

[profiles.benchmark]
entries = ["yarn-cache", "yarn-install-state"]
